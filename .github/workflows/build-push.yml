name: Build and push image

# HANYA manual: tidak ada trigger push, pull_request, atau schedule.
# Jalankan dari tab Actions > "Build and push image" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag image (kosong = sha-<7 karakter commit>)"
        required: false
        type: string
      push_latest:
        description: "Ikut push tag 'latest'"
        required: false
        type: boolean
        default: false
      base_path:
        description: "Build arg BASE_PATH untuk deploy di sub-path, mis. /playground (kosong = tanpa prefix)"
        required: false
        type: string
      run_tests:
        description: "Jalankan typecheck dan test sebelum build"
        required: false
        type: boolean
        default: true

# Token bawaan hanya boleh membaca isi repo.
permissions:
  contents: read

# Satu build per branch pada satu waktu; yang kedua menunggu, tidak membatalkan push yang sedang berjalan.
concurrency:
  group: build-push-${{ github.ref }}
  cancel-in-progress: false

env:
  # Nama repository di Docker Hub (di luar username). Ubah lewat Settings > Variables > DOCKERHUB_REPOSITORY.
  IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || 'devops-playground' }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Input pengguna masuk lewat env (bukan di-interpolasi ke skrip) lalu divalidasi, supaya aman dari script injection.
      - name: Validate inputs and secrets
        id: vars
        env:
          TAG_INPUT: ${{ inputs.tag }}
          BASE_PATH_INPUT: ${{ inputs.base_path }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "${DOCKERHUB_USERNAME}" || -z "${DOCKERHUB_TOKEN}" ]]; then
            echo "::error::Secret DOCKERHUB_USERNAME dan DOCKERHUB_TOKEN belum diisi (Settings > Secrets and variables > Actions)."
            exit 1
          fi

          tag="${TAG_INPUT:-sha-${GITHUB_SHA::7}}"
          if [[ ! "${tag}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Tag tidak valid. Gunakan huruf, angka, '_', '.', '-' (maks 128 karakter)."
            exit 1
          fi

          if [[ -n "${BASE_PATH_INPUT}" && ! "${BASE_PATH_INPUT}" =~ ^/[A-Za-z0-9._/-]*$ ]]; then
            echo "::error::BASE_PATH harus diawali '/' dan hanya berisi huruf, angka, '.', '_', '-', '/'."
            exit 1
          fi

          # Docker Hub mewajibkan huruf kecil.
          image="${DOCKERHUB_USERNAME}/${IMAGE_NAME}"
          {
            echo "tag=${tag}"
            echo "image=${image,,}"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        if: ${{ inputs.run_tests }}
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Typecheck and test
        if: ${{ inputs.run_tests }}
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Menghasilkan tag dan label OCI (source, revision, created, version) agar image bisa dilacak ke commit asalnya.
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable=${{ inputs.push_latest }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_PATH=${{ inputs.base_path }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          TAG: ${{ steps.vars.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image terkirim ke Docker Hub"
            echo ""
            echo "- Image: \`${IMAGE}:${TAG}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo ""
            echo "Tag yang dipush:"
            echo '```'
            echo "${TAGS}"
            echo '```'
            echo ""
            echo "Pakai di Kubernetes (pin dengan digest agar tidak berubah diam-diam):"
            echo '```'
            echo "image: ${IMAGE}@${DIGEST}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
