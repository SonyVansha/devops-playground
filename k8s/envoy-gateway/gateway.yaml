# Opsional: hanya bila cluster belum punya Gateway. Di platform yang sudah menyediakan Gateway, lewati file ini
# dan ubah `parentRefs` di routes.yaml agar menunjuk ke Gateway milik platform.
# Prasyarat: Envoy Gateway terpasang dan GatewayClass ada (nama di bawah sering `eg`; sesuaikan dengan cluster).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: playground-gateway
  namespace: playground
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
# Pengaturan klien di level Gateway.
#  - enableEnvoyHeaders: header x-envoy-* (mis. x-envoy-attempt-count) ikut dikirim ke app, terlihat di /api/gateway.
#  - numTrustedHops: jumlah proxy tepercaya di depan Envoy (mis. CDN/Cloudflare) agar IP klien benar.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: playground-client
  namespace: playground
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: playground-gateway
  clientIPDetection:
    xForwardedFor:
      numTrustedHops: 1
  headers:
    enableEnvoyHeaders: true
